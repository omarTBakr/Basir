# Prometheus runs on the host network, so every target is a loopback port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:19090]

  - job_name: node
    static_configs:
      - targets: [127.0.0.1:19101]

  - job_name: gpu
    static_configs:
      - targets: [127.0.0.1:19835]

  - job_name: postgres
    static_configs:
      - targets: [127.0.0.1:19187]

  # Airflow's StatsD metrics, through statsd-exporter
  - job_name: airflow
    static_configs:
      - targets: [127.0.0.1:19102]

  # The Basir FastAPI server; DOWN until `basir` serves on :18000.
  - job_name: basir
    scrape_interval: 5s
    static_configs:
      - targets: [127.0.0.1:18000]
