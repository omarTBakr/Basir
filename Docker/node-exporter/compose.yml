# Host metrics on 127.0.0.1:9101. Host network and pid so it sees the laptop's real
# interfaces and processes; runs as the desktop user (HOST_UID, exported by scripts/stack.sh).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    network_mode: host
    pid: host
    user: ${HOST_UID:-1000}  # the desktop user, so it can stat drives under /run/media/<user>
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9101
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:9101/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
