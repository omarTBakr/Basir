# Postgres metrics on 127.0.0.1:9187.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:9187:9187
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:9187/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
