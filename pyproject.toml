[project]
name = "basir"
version = "0.1.0"
description = "Spatial memory for a moving camera: remembers where it saw your things and guides you back to them."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=5.2.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.20",
    "temporalio>=1.35.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx2>=2.16.0",  # starlette.testclient imports it (plain httpx is its deprecated fallback)
    "mypy>=1.19.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff==0.15.4",
    "scipy>=1.18.1",
    "types-tqdm>=4.67.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: hits the internet (deselected by default; run with -m network)",
    "slow: spawns processes, servers or downloads; runs by default, skip with -m 'not network and not slow'",
    "gpu: needs a CUDA GPU (none do yet; reserved for Phase 1 perception tests)",
]
addopts = "-m 'not network' -p no:dash"
filterwarnings = [
    # raised inside MLflow's own SQLAlchemy store, not Basir code
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# Every third-party package imported by basir/, utilities/ and scripts/ ships type information
# (py.typed or stubs; tqdm via types-tqdm), so no ignore_missing_imports is needed. Add an
# override here, per module, only for a new dependency that has none.
