[project]
name = "basir"
version = "0.1.0"
description = "Spatial memory for a moving camera: remembers where it saw your things and guides you back to them."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "langfuse>=5.2.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits the internet (deselected by default; run with -m network)"]
addopts = "-m 'not network' -p no:dash"
filterwarnings = [
    # raised inside MLflow's own SQLAlchemy store, not Basir code
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]
