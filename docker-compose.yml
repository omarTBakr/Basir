# Basir local stack: experiment tracking, workflow engine and monitoring.
#
#   scripts/stack.sh up       # start (creates infra/stack.env on first run)
#   scripts/stack.sh status   # URLs, container health, Prometheus targets
#
# Every port binds to 127.0.0.1. Prometheus, Grafana and node-exporter use the host
# network so they can reach loopback-only services (the Basir server on :8000) and
# report the laptop's real network interfaces.

name: basir

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/stack.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/stack.env}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d mlflow']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mlflow:
    build: ./infra/mlflow
    image: basir/mlflow:3.18.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
    volumes:
      - ${MLFLOW_ARTIFACTS_DIR:-./mlartifacts}:/mlartifacts
    ports:
      - 127.0.0.1:5000:5000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      PROMETHEUS_ENDPOINT: 0.0.0.0:9091
    ports:
      - 127.0.0.1:7233:7233
      - 127.0.0.1:9091:9091
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, 127.0.0.1:7233]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.56.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8080"
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    ports:
      - 127.0.0.1:8233:8080
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    network_mode: host
    pid: host
    user: ${HOST_UID:-1000}  # the desktop user, so it can stat drives under /run/media/<user>
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9101
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:9101/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.16.0
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    ports:
      - 127.0.0.1:9835:9835
    healthcheck:
      test: [CMD, nvidia-smi, -L]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:9187:9187
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:9187/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    logging: *logging
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.1.8
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/stack.env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/host.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [CMD-SHELL, "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
