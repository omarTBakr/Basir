# Local checks before commit / push.  One-time setup (edits .git/hooks):
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Run everything by hand:  uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4 # keep in sync with ruff in pyproject.toml and .github/workflows/ci.yml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024] # datasets and models go through DVC, not git
        exclude: ^uv\.lock$ # ~1 MB already and grows with every dependency
      - id: detect-private-key

  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
