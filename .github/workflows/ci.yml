name: CI

on:
  push:
    branches-ignore: [software_engineering] # docs-only orphan branch, no code to test
  pull_request:
    branches-ignore: [software_engineering]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  RUFF_VERSION: "0.15.4" # keep in sync with pyproject.toml and .pre-commit-config.yaml

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: ruff check
        run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .
      - name: ruff format --check
        run: uvx "ruff@${RUFF_VERSION}" format --check --diff .

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1" # keep the CPU torch installed by sync-cpu-env.sh
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen (CPU torch)
        run: .github/scripts/sync-cpu-env.sh
      - name: pytest
        env:
          BASIR_DATA_DIR: ${{ runner.temp }}/basir-data # empty; MLflow falls back to a SQLite store here
        run: |
          mkdir -p "$BASIR_DATA_DIR"
          uv run pytest -q

  # Non-blocking until the existing errors are fixed (missing tqdm stubs in utilities/utility.py and an
  # observe() overload mismatch in utilities/tracing.py). Drop continue-on-error once mypy is clean.
  mypy:
    name: mypy (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen (CPU torch)
        run: .github/scripts/sync-cpu-env.sh
      - name: mypy basir utilities
        run: uvx mypy@1.19.0 --python-executable .venv/bin/python basir utilities
